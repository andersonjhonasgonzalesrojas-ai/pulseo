function QRCode(typeNumber, errorCorrectLevel) {
	this.typeNumber = typeNumber;
	this.errorCorrectLevel = errorCorrectLevel;
	this.modules = null;
	this.moduleCount = 0;
	this.dataCache = null;
	this.dataList = [];

			throw new Error(row + "," + col);

				var totalDataCount = 0;
				for (var i = 0; i < rsBlocks.length; i++) {
					totalDataCount += rsBlocks[i].dataCount;
				}

				for (var x = 0; x < this.dataList.length; x++) {
					var data = this.dataList[x];
					buffer.put(data.mode, 4);
					buffer.put(data.getLength(), QRUtil.getLengthInBits(data.mode, typeNumber) );
					data.write(buffer);
				}

					break;
			}
			this.typeNumber = typeNumber;
		}
		this.makeImpl(false, this.getBestMaskPattern() );
	},
	
	makeImpl : function(test, maskPattern) {
		
		this.moduleCount = this.typeNumber * 4 + 17;
		this.modules = new Array(this.moduleCount);
		
		for (var row = 0; row < this.moduleCount; row++) {
			
			this.modules[row] = new Array(this.moduleCount);
			
			for (var col = 0; col < this.moduleCount; col++) {
				this.modules[row][col] = null;//(col + row) % 3;
			}

		this.setupPositionProbePattern(0, 0);
		this.setupPositionProbePattern(this.moduleCount - 7, 0);
		this.setupPositionProbePattern(0, this.moduleCount - 7);
		this.setupPositionAdjustPattern();
		this.setupTimingPattern();
		this.setupTypeInfo(test, maskPattern);
		
		if (this.typeNumber >= 7) {
			this.setupTypeNumber(test);
		}
	
		if (this.dataCache === null) {
			this.dataCache = QRCode.createData(this.typeNumber, this.errorCorrectLevel, this.dataList);
		}
	
		this.mapData(this.dataCache, maskPattern);
	},

	setupPositionProbePattern : function(row, col)  {
		
		for (var r = -1; r <= 7; r++) {
			
			if (row + r <= -1 || this.moduleCount <= row + r) continue;
			
			for (var c = -1; c <= 7; c++) {
				
				if (col + c <= -1 || this.moduleCount <= col + c) continue;
				
				if ( (0 <= r && r <= 6 && (c === 0 || c === 6) ) || 
                     (0 <= c && c <= 6 && (r === 0 || r === 6) ) || 
                     (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
					this.modules[row + r][col + c] = true;
				} else {
					this.modules[row + r][col + c] = false;
				}
			}		
		}		
	},
	
	getBestMaskPattern : function() {
	
		var minLostPoint = 0;
		var pattern = 0;
	
		for (var i = 0; i < 8; i++) {
			
			this.makeImpl(true, i);
	
			var lostPoint = QRUtil.getLostPoint(this);
	
			if (i === 0 || minLostPoint >  lostPoint) {
				minLostPoint = lostPoint;
				pattern = i;
			}
		}
	
		return pattern;
	},
	
	createMovieClip : function(target_mc, instance_name, depth) {
	
		var qr_mc = target_mc.createEmptyMovieClip(instance_name, depth);
		var cs = 1;
	
		this.make();

		for (var row = 0; row < this.modules.length; row++) {
			
			var y = row * cs;
			
			for (var col = 0; col < this.modules[row].length; col++) {
	
				var x = col * cs;
				var dark = this.modules[row][col];
			
				if (dark) {
					qr_mc.beginFill(0, 100);
					qr_mc.moveTo(x, y);
					qr_mc.lineTo(x + cs, y);
					qr_mc.lineTo(x + cs, y + cs);
					qr_mc.lineTo(x, y + cs);
					qr_mc.endFill();
				}
			}
		}
		
		return qr_mc;
	},

	setupTimingPattern : function() {
		
		for (var r = 8; r < this.moduleCount - 8; r++) {
			if (this.modules[r][6] !== null) {
				continue;
			}
			this.modules[r][6] = (r % 2 === 0);
		}
	
		for (var c = 8; c < this.moduleCount - 8; c++) {
			if (this.modules[6][c] !== null) {
				continue;
			}
			this.modules[6][c] = (c % 2 === 0);
		}
	},
	
	setupPositionAdjustPattern : function() {
	
		var pos = QRUtil.getPatternPosition(this.typeNumber);
		
		for (var i = 0; i < pos.length; i++) {
		
			for (var j = 0; j < pos.length; j++) {
			
				var row = pos[i];
				var col = pos[j];
				
				if (this.modules[row][col] !== null) {
					continue;
				}
				
				for (var r = -2; r <= 2; r++) {
				
					for (var c = -2; c <= 2; c++) {
					
						if (Math.abs(r) === 2 || 
                            Math.abs(c) === 2 ||
                            (r === 0 && c === 0) ) {
							this.modules[row + r][col + c] = true;
						} else {
							this.modules[row + r][col + c] = false;
						}
					}
				}
			}
		}
	},
	
	setupTypeNumber : function(test) {
	
		var bits = QRUtil.getBCHTypeNumber(this.typeNumber);
        var mod;
	
		for (var i = 0; i < 18; i++) {
			mod = (!test && ( (bits >> i) & 1) === 1);
			this.modules[Math.floor(i / 3)][i % 3 + this.moduleCount - 8 - 3] = mod;
		}
	
		for (var x = 0; x < 18; x++) {
			mod = (!test && ( (bits >> x) & 1) === 1);
			this.modules[x % 3 + this.moduleCount - 8 - 3][Math.floor(x / 3)] = mod;
		}
	},
	
	setupTypeInfo : function(test, maskPattern) {
	
		var data = (this.errorCorrectLevel << 3) | maskPattern;
		var bits = QRUtil.getBCHTypeInfo(data);
        var mod;
	
		// vertical		
		for (var v = 0; v < 15; v++) {
	
			mod = (!test && ( (bits >> v) & 1) === 1);
	
			if (v < 6) {
				this.modules[v][8] = mod;
			} else if (v < 8) {
				this.modules[v + 1][8] = mod;
			} else {
				this.modules[this.moduleCount - 15 + v][8] = mod;
			}
		}
	
		// horizontal
		for (var h = 0; h < 15; h++) {
	
			mod = (!test && ( (bits >> h) & 1) === 1);
			
			if (h < 8) {
				this.modules[8][this.moduleCount - h - 1] = mod;
			} else if (h < 9) {
				this.modules[8][15 - h - 1 + 1] = mod;
			} else {
				this.modules[8][15 - h - 1] = mod;
			}
		}
	
		// fixed module
		this.modules[this.moduleCount - 8][8] = (!test);
	
	},
	
	mapData : function(data, maskPattern) {
		
		var inc = -1;
		var row = this.moduleCount - 1;
		var bitIndex = 7;
		var byteIndex = 0;
		
		for (var col = this.moduleCount - 1; col > 0; col -= 2) {
	
			if (col === 6) col--;
	
			while (true) {
	
				for (var c = 0; c < 2; c++) {
					
					if (this.modules[row][col - c] === null) {
						
						var dark = false;
	
						if (byteIndex < data.length) {
							dark = ( ( (data[byteIndex] >>> bitIndex) & 1) === 1);
						}
	
						var mask = QRUtil.getMask(maskPattern, row, col - c);
	
						if (mask) {
							dark = !dark;
						}
						
						this.modules[row][col - c] = dark;
						bitIndex--;
	
						if (bitIndex === -1) {
							byteIndex++;
							bitIndex = 7;
						}
					}
				}
								
				row += inc;
	
				if (row < 0 || this.moduleCount <= row) {
					row -= inc;
					inc = -inc;
					break;
				}
			}
		}
		
	}

};

QRCode.PAD0 = 0xEC;
QRCode.PAD1 = 0x11;

QRCode.createData = function(typeNumber, errorCorrectLevel, dataList) {
	
	var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectLevel);
	
	var buffer = new QRBitBuffer();
	
	for (var i = 0; i < dataList.length; i++) {
		var data = dataList[i];
		buffer.put(data.mode, 4);
		buffer.put(data.getLength(), QRUtil.getLengthInBits(data.mode, typeNumber) );
		data.write(buffer);
	}

	// calc num max data.
	var totalDataCount = 0;
	for (var x = 0; x < rsBlocks.length; x++) {
		totalDataCount += rsBlocks[x].dataCount;
	}

	if (buffer.getLengthInBits() > totalDataCount * 8) {
		throw new Error("code length overflow. (" + 
            buffer.getLengthInBits() + 
            ">" +  
            totalDataCount * 8 + 
            ")");
	}

	if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
		buffer.put(0, 4);
	}

	// padding
	while (buffer.getLengthInBits() % 8 !== 0) {
		buffer.putBit(false);
	}

	// padding
	while (true) {
		
		if (buffer.getLengthInBits() >= totalDataCount * 8) {
			break;
		}
		buffer.put(QRCode.PAD0, 8);
		
		if (buffer.getLengthInBits() >= totalDataCount * 8) {
			break;
		}
		buffer.put(QRCode.PAD1, 8);
	}

	return QRCode.createBytes(buffer, rsBlocks);
};

QRCode.createBytes = function(buffer, rsBlocks) {

	var offset = 0;
	
	var maxDcCount = 0;
	var maxEcCount = 0;
	
	var dcdata = new Array(rsBlocks.length);
	var ecdata = new Array(rsBlocks.length);
	
	for (var r = 0; r < rsBlocks.length; r++) {

		var dcCount = rsBlocks[r].dataCount;
		var ecCount = rsBlocks[r].totalCount - dcCount;

		maxDcCount = Math.max(maxDcCount, dcCount);
		maxEcCount = Math.max(maxEcCount, ecCount);
		
		dcdata[r] = new Array(dcCount);
		
		for (var i = 0; i < dcdata[r].length; i++) {
			dcdata[r][i] = 0xff & buffer.buffer[i + offset];
		}
		offset += dcCount;
		
		var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
		var rawPoly = new QRPolynomial(dcdata[r], rsPoly.getLength() - 1);

		var modPoly = rawPoly.mod(rsPoly);
		ecdata[r] = new Array(rsPoly.getLength() - 1);
		for (var x = 0; x < ecdata[r].length; x++) {
            var modIndex = x + modPoly.getLength() - ecdata[r].length;
			ecdata[r][x] = (modIndex >= 0)? modPoly.get(modIndex) : 0;
		}

	}
	
	var totalCodeCount = 0;
	for (var y = 0; y < rsBlocks.length; y++) {
		totalCodeCount += rsBlocks[y].totalCount;
	}

	var data = new Array(totalCodeCount);
	var index = 0;

	for (var z = 0; z < maxDcCount; z++) {
		for (var s = 0; s < rsBlocks.length; s++) {
			if (z < dcdata[s].length) {
				data[index++] = dcdata[s][z];
			}
		}
	}

	for (var xx = 0; xx < maxEcCount; xx++) {
		for (var t = 0; t < rsBlocks.length; t++) {
			if (xx < ecdata[t].length) {
				data[index++] = ecdata[t][xx];
			}
		}
	}

	return data;

};

function sha256(bytes){
  const l=bytes.length, bl=((l+9+63)>>6)<<6, m=new Uint8Array(bl); m.set(bytes); m[l]=0x80;
  const bits=l*8; m[bl-4]=(bits>>>24)&255; m[bl-3]=(bits>>>16)&255; m[bl-2]=(bits>>>8)&255; m[bl-1]=bits&255;
  m[bl-8]=Math.floor(l/0x20000000)&255;
  let h=[0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19];
  const w=new Uint32Array(64), r=(x,n)=>(x>>>n)|(x<<(32-n));
  for(let i=0;i<bl;i+=64){
    for(let t=0;t<16;t++) w[t]=(m[i+t*4]<<24)|(m[i+t*4+1]<<16)|(m[i+t*4+2]<<8)|m[i+t*4+3];
    for(let t=16;t<64;t++){ const s0=r(w[t-15],7)^r(w[t-15],18)^(w[t-15]>>>3), s1=r(w[t-2],17)^r(w[t-2],19)^(w[t-2]>>>10); w[t]=(w[t-16]+s0+w[t-7]+s1)|0; }
    let [a,b,c,d,e,f,g,hh]=h;
    for(let t=0;t<64;t++){ const S1=r(e,6)^r(e,11)^r(e,25), ch=(e&f)^(~e&g), t1=(hh+S1+ch+K256[t]+w[t])|0, S0=r(a,2)^r(a,13)^r(a,22), mj=(a&b)^(a&c)^(b&c), t2=(S0+mj)|0; hh=g;g=f;f=e;e=(d+t1)|0;d=c;c=b;b=a;a=(t1+t2)|0; }
    h=[(h[0]+a)|0,(h[1]+b)|0,(h[2]+c)|0,(h[3]+d)|0,(h[4]+e)|0,(h[5]+f)|0,(h[6]+g)|0,(h[7]+hh)|0];
  }
  const o=new Uint8Array(32); h.forEach((v,i)=>{o[i*4]=(v>>>24)&255;o[i*4+1]=(v>>>16)&255;o[i*4+2]=(v>>>8)&255;o[i*4+3]=v&255;}); return o;
}
const enc = s => new TextEncoder().encode(s);
function hmac(keyStr,msg){
  let k=enc(keyStr); if(k.length>64) k=sha256(k);
  const kp=new Uint8Array(64); kp.set(k);
  const ip=kp.map(b=>b^0x36), op=kp.map(b=>b^0x5c), mb=enc(msg);
  const inner=new Uint8Array(64+mb.length); inner.set(ip); inner.set(mb,64);
  const ih=sha256(inner); const outer=new Uint8Array(96); outer.set(op); outer.set(ih,64);
  return sha256(outer);
}
function b64u(bytes){ let s=''; bytes.forEach(b=>s+=String.fromCharCode(b)); return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,''); }
const hashPin = p => b64u(sha256(enc('pin:'+String(p).trim())));

/* ============ payload del QR ============ */
// PQ2|evento|tipo|id|pax(0=ilimitado)|grupo|promotor|nombre|extra|firma
const personKey=n=>String(n||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/\s+/g,' ').trim();
const ascii=(s,n)=>clean(String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^\x20-\x7e]/g,''),n);
function makePayload(cfg,{type,group,promoter,guest,extra,pax}){
  const parts=['PQ2',cfg.eventId,TYPES[type].code,rid(8),String(Math.max(0,Math.min(99,pax|0))),ascii(group,20),ascii(promoter,22),ascii(guest,28),ascii(extra,10)];
  const body=parts.join('|');
  return {text: body+'|'+b64u(hmac(cfg.secret,body)).slice(0,12), id:parts[3]};
}
function readPayload(cfg,text){
  const p=String(text||'').split('|');
  if(p.length!==10||p[0]!=='PQ2') return {ok:false,why:'Este QR no es una entrada'};
  if(p[1]!==cfg.eventId) return {ok:false,why:'QR de otro evento'};
  const body=p.slice(0,9).join('|');
  if(b64u(hmac(cfg.secret,body)).slice(0,12)!==p[9]) return {ok:false,why:'QR falso o alterado'};
  const type=CODE2TYPE[p[2]]; if(!type) return {ok:false,why:'Tipo de entrada desconocido'};
  return {ok:true,type,id:p[3],pax:parseInt(p[4],10)||0,group:p[5],promoter:p[6],guest:p[7],extra:p[8]};
}
// link firmado de cada grupo: ?g=<n>.<firma>
const groupSig=(cfg,i)=>b64u(hmac(cfg.secret,'g:'+i+':'+cfg.groups[i].name)).slice(0,8);
const groupHex=(cfg,i)=>Array.from(hmac(cfg.secret,'gh:'+i+':'+cfg.groups[i].name).slice(0,5),b=>b.toString(16).padStart(2,'0')).join('');
function groupFromLink(cfg){
  let g=''; try{ g=new URLSearchParams(location.search).get('g')||''; }catch(e){}
  const hm=location.hash.match(/^#g-(\d+)-([0-9a-f]{10})$/);
  if(hm&&TEST_G==null){ const n=+hm[1]; if(cfg.groups&&cfg.groups[n]&&groupHex(cfg,n)===hm[2]) return {i:n,name:cfg.groups[n].name}; return null; }
  if(TEST_G!=null) g=TEST_G+'.'+groupSig(cfg,TEST_G);
  const [i,s]=g.split('.'); const n=parseInt(i,10);
  if(!cfg.groups||!cfg.groups[n]||groupSig(cfg,n)!==s) return null;
  return {i:n,name:cfg.groups[n].name};
}
const pageBase=()=>(/^https?:$/.test(location.protocol)&&!window.claude)?location.origin+location.pathname:'';
const groupLink=(cfg,i)=>pageBase()?pageBase()+'#g-'+i+'-'+groupHex(cfg,i):cfg.publicUrl?cfg.publicUrl.replace(/#.*$/,'')+'#g-'+i+'-'+groupHex(cfg,i):location.origin.replace(/^null$/,'file://')+location.pathname+'?g='+i+'.'+groupSig(cfg,i);

/* ============ dibujo de la entrada ============ */
const imgCache={};
function loadImg(src){ if(!src) return Promise.resolve(null); if(imgCache[src]) return imgCache[src]; return imgCache[src]=new Promise(r=>{const i=new Image(); i.onload=()=>r(i); i.onerror=()=>r(null); i.src=src;}); }
function rr(ctx,x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
function wrapText(ctx,text,x,y,maxW,lh,maxLines){ const words=String(text).split(' '); let line='',lines=[]; for(const w of words){ const t=line?line+' '+w:w; if(ctx.measureText(t).width>maxW&&line){lines.push(line);line=w;}else line=t;} if(line)lines.push(line); lines=lines.slice(0,maxLines); lines.forEach((l,i)=>ctx.fillText(l,x,y+i*lh)); return lines.length; }
function drawQR(ctx,text,x,y,size){
  if(typeof qrcode!=='function'){ ctx.fillStyle='#000'; ctx.font='bold 30px sans-serif'; ctx.textAlign='center'; ctx.fillText('Sin conexión',x+size/2,y+size/2); return; }
  const q=qrcode(0,'M'); q.addData(text,'Byte'); q.make();
  const n=q.getModuleCount(), quiet=3, cell=size/(n+quiet*2);
  ctx.fillStyle='#fff'; ctx.fillRect(x,y,size,size); ctx.fillStyle='#000';
  for(let r=0;r<n;r++) for(let c=0;c<n;c++) if(q.isDark(r,c)) ctx.fillRect(Math.floor(x+(c+quiet)*cell),Math.floor(y+(r+quiet)*cell),Math.ceil(cell),Math.ceil(cell));
}
async function renderTicket(cfg,type,qrText,info){
  const W=1080,H=1920, t=cfg.types[type], col=TYPES[type].color;
  const cv=document.createElement('canvas'); cv.width=W; cv.height=H; const ctx=cv.getContext('2d');
  const tpl=await loadImg(t.template);
  const F='-apple-system,"Helvetica Neue",Arial,sans-serif';
  if(tpl){
    const s=Math.max(W/tpl.width,H/tpl.height); ctx.drawImage(tpl,(W-tpl.width*s)/2,(H-tpl.height*s)/2,tpl.width*s,tpl.height*s);
    const size=W*t.qrSize/100, cx=W*t.qrX/100, cy=H*t.qrY/100, pad=size*0.06;
    const nameH=t.showName? size*0.2:0;
    ctx.fillStyle='#fff'; rr(ctx,cx-size/2-pad,cy-size/2-pad,size+pad*2,size+pad*2+nameH,size*0.06); ctx.fill();
    drawQR(ctx,qrText,cx-size/2,cy-size/2,size);
    if(t.showName){ ctx.fillStyle='#111'; ctx.textAlign='center'; const nm=info.guest.toUpperCase().slice(0,28); let fs=Math.round(size*0.075); ctx.font=`800 ${fs}px ${F}`; while(fs>10&&ctx.measureText(nm).width>size+pad*1.4){ fs--; ctx.font=`800 ${fs}px ${F}`; } ctx.fillText(nm,cx,cy+size/2+size*0.09);
      ctx.fillStyle=col==='#d4af37'?'#9a7b12':col; ctx.font=`700 ${Math.round(size*0.05)}px ${F}`; ctx.fillText(`${TYPES[type].label}${type==='vip'&&info.pax>1?' · '+info.pax+' PERSONAS':''}`,cx,cy+size/2+size*0.16); }
    return cv;
  }
  // plantilla por defecto
  ctx.fillStyle='#0b0b0f'; ctx.fillRect(0,0,W,H);
  let g=ctx.createRadialGradient(W/2,260,40,W/2,260,1100); g.addColorStop(0,col+'88'); g.addColorStop(1,'#0b0b0f00'); ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  g=ctx.createLinearGradient(0,H-500,0,H); g.addColorStop(0,'#0b0b0f00'); g.addColorStop(1,col+'44'); ctx.fillStyle=g; ctx.fillRect(0,H-500,W,500);
  ctx.textAlign='center'; ctx.fillStyle='#fff';
  ctx.font=`900 104px ${F}`; const nl=wrapText(ctx,(cfg.eventName||'EVENTO').toUpperCase(),W/2,210,W-140,108,2);
  ctx.fillStyle='#c9c9d2'; ctx.font=`600 44px ${F}`; const yInfo=210+nl*108+10;
  if(cfg.date) ctx.fillText(cfg.date,W/2,yInfo);
  if(cfg.venue) ctx.fillText(cfg.venue,W/2,yInfo+58);
  const label=TYPES[type].label; ctx.font=`900 52px ${F}`; const lw=ctx.measureText(label).width+90;
  ctx.fillStyle=col; rr(ctx,W/2-lw/2,560,lw,96,48); ctx.fill(); ctx.fillStyle=type==='vip'?'#1a1404':'#fff'; ctx.fillText(label,W/2,627);
  const cx=150,cy=720,cw=W-300,qs=cw-80;
  ctx.fillStyle='#fff'; rr(ctx,cx,cy,cw,qs+260,40); ctx.fill();
  drawQR(ctx,qrText,cx+40,cy+40,qs);
  ctx.fillStyle='#111'; ctx.font=`800 56px ${F}`; ctx.fillText(info.guest.toUpperCase().slice(0,24),W/2,cy+qs+120);
  ctx.fillStyle='#666'; ctx.font=`600 34px ${F}`;
  let sub = type==='cumple' ? `Cumpleaños${info.extra?' · '+info.extra:''}` : `${info.group||''}`;
  ctx.fillText(sub.slice(0,40),W/2,cy+qs+180);
  ctx.fillStyle='#fff'; ctx.font=`700 40px ${F}`;
  ctx.fillText(type==='vip'?(info.pax>1?`Válido para ${info.pax} personas`:'Válido para 1 persona'):'Entrada libre · muestra este QR en puerta',W/2,H-200);
  ctx.fillStyle='#8b8b98'; ctx.font=`500 32px ${F}`; ctx.fillText('Presenta este QR en puerta · Código '+info.id,W/2,H-140);
  return cv;
}

  stopCam();
  const h=location.hash.replace('#','');
  if(!CFG || (ADMIN_TEST && h==='admin')) return viewAdmin();
  if(h==='escaner') return viewScanner();
  if(h==='lider') return viewLeader();
  return viewPromoter();
}

  const video=$('#video'), work=document.createElement('canvas'), wctx=work.getContext('2d',{willReadFrequently:true});
  let last='',lastAt=0,busy=false;
  const handle=text=>{
    const now=Date.now(); if(busy||(text===last&&now-lastAt<3000)) return; last=text; lastAt=now; busy=true;
    const r=readPayload(CFG,text), box=$('#result');

let _dl;
function claudeDownloads(){ if(_dl!==undefined) return _dl; if(!window.claude||typeof window.claude.use!=='function') return (_dl=Promise.resolve(null));
  return (_dl=Promise.race([window.claude.use('downloads').catch(()=>null),new Promise(r=>setTimeout(()=>r(null),4000))])); }
async function shareOrDownload(blob,name,mime){
  const dl=await claudeDownloads();
  if(dl){ try{ await dl.save({filename:name,data:blob}); return; }catch(e){ if(e&&e.code==='declined') return; } }
  const f=new File([blob],name,{type:mime});
  try{ if(navigator.canShare&&navigator.canShare({files:[f]})){ await navigator.share({files:[f],title:name}); return; } }catch(e){ if(e.name==='AbortError') return; }
  try{ const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click(); a.remove(); }catch(e){}
  toast('Mantén presionada la imagen para guardarla');
}
function mergeInto(s,incoming){
  let added=0;
  Object.entries(incoming||{}).forEach(([id,x])=>{ const e=s[id]||{...x,times:[]}; const set=new Set(e.times); (x.times||[]).forEach(t=>{ if(!set.has(t)){ set.add(t); added++; } });
    e.times=[...set].sort((a,b)=>a-b); e.used=e.times.length; s[id]=e; });
  return added;
}
const evSlug=c=>(c.eventName||'evento').toLowerCase().normalize('NFD').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'evento';
function deviceId(){ let d=store.get('pq_dev',''); if(!d){ d='CEL-'+rid(4); store.set('pq_dev',d); } return d; }

/* ============ envío del conteo (puerta → admin) ============ */
const qKey=()=>'pq_q_'+CFG.eventId;
function pushQ(row){ if(!CFG.sheetUrl) return; const q=store.get(qKey(),[]); q.push(row); store.set(qKey(),q); setTimeout(syncNow,600); }
function queueRow(r,t,n){ pushQ({k:'scan',uid:r.id+'-'+t,t,group:r.group,guest:r.guest,type:TYPES[r.type].label,promoter:r.promoter,extra:r.extra,id:r.id,n,dev:deviceId()}); }
function queueGen(pl,info){ pushQ({k:'gen',uid:'g-'+pl.id,t:Date.now(),group:ascii(info.group,20),promoter:ascii(info.promoter,22),type:TYPES[info.type].label,guest:ascii(info.guest,28),pax:info.type==='vip'?info.pax:'',id:pl.id}); }
let syncing=false, syncTimer=0;
async function syncNow(){
  const st=$('#syncSt'); if(!CFG.sheetUrl){ return; }
  if(syncing) return; const q=store.get(qKey(),[]);
  if(!q.length){ if(st) st.textContent=st.dataset.ok||'● En vivo · todo enviado'; return; }
  if(!navigator.onLine){ if(st) st.textContent=`○ Sin internet · ${q.length} por enviar`; return; }
  syncing=true; const batch=q.slice(0,60);
  try{ await fetch(CFG.sheetUrl,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({key:CFG.sheetKey,rows:batch})});
    const sent=new Set(batch.map(b=>b.uid)); store.set(qKey(),store.get(qKey(),[]).filter(x=>!sent.has(x.uid)));
  }catch(e){}
  syncing=false; const left=store.get(qKey(),[]).length;
  if(st) st.textContent=left?`○ Enviando… ${left} pendientes`:(st.dataset.ok||'● En vivo · todo enviado');
  if(left) setTimeout(syncNow,3000);
}
function startSync(){ clearInterval(syncTimer); if(!CFG.sheetUrl) return; syncNow(); syncTimer=setInterval(syncNow,8000); }
function sendCount(){
  const data={pq:2,ev:CFG.eventId,dev:deviceId(),at:Date.now(),scans:store.get(scansKey(),{})};
  const n=Object.values(data.scans).reduce((a,x)=>a+x.times.length,0);
  shareOrDownload(new Blob([JSON.stringify(data)],{type:'application/json'}),`conteo-${evSlug(CFG)}-${data.dev}.json`,'application/json');
  toast(`Conteo de ${n} ingresos listo para enviar`);
}

/* ============ código para Google Sheets ============ */
function appsScript(key,admin){
  return [
"// PASE QR · conteo en vivo. Pega esto en Extensiones > Apps Script y publícalo como Aplicación web.",
"var KEY = '"+key+"';      // la usa la app del evento",
"var ADMIN = '"+admin+"';  // solo tu panel de admin",
"var HG = ['Fecha y hora','Grupo','Promotor','Tipo','Nombre del QR','Personas VIP','Codigo QR','ID'];",
"var HI = ['Fecha y hora','Grupo','Nombre del QR','Tipo','Promotor','Fecha cumple','Codigo QR','Ingreso #','Celular','ID'];",
"function hoja(ss, name, head) {",
"  var sh = ss.getSheetByName(name);",
"  if (!sh) { sh = ss.insertSheet(name); sh.appendRow(head); sh.setFrozenRows(1); sh.getRange(1,1,1,head.length).setFontWeight('bold'); }",
"  return sh;",
"}",
"function agregar(sh, rows) {",
"  if (!rows.length) return 0;",
"  var w = rows[0].length, last = sh.getLastRow(), seen = {};",
"  if (last > 1) sh.getRange(2, w, last-1, 1).getValues().forEach(function(r){ seen[String(r[0])] = 1; });",
"  var add = rows.filter(function(r){ if (seen[r[w-1]]) return false; seen[r[w-1]] = 1; return true; });",
"  if (add.length) { sh.getRange(sh.getLastRow()+1, 1, add.length, w).setValues(add); sh.getRange(2, 1, sh.getLastRow()-1, 1).setNumberFormat('dd/MM HH:mm:ss'); }",
"  return add.length;",
"}",
"function doPost(e) {",
"  var d = JSON.parse(e.postData.contents);",
"  if (d.key !== KEY) return ContentService.createTextOutput('no');",
"  var lock = LockService.getScriptLock(); lock.waitLock(25000);",
"  try {",
"    var ss = SpreadsheetApp.getActiveSpreadsheet(), g = [], s = [];",
"    (d.rows || []).forEach(function(r){",
"      if (r.k === 'gen') g.push([new Date(r.t), r.group, r.promoter, r.type, r.guest, r.pax || '', r.id, r.uid]);",
"      else s.push([new Date(r.t), r.group, r.guest, r.type, r.promoter, r.extra || '', r.id, r.n, r.dev, r.uid]);",
"    });",
"    var n = agregar(hoja(ss, 'QR generados', HG), g) + agregar(hoja(ss, 'Ingresos', HI), s);",
"    if (n) resumen();",
"  } finally { lock.releaseLock(); }",
"  return ContentService.createTextOutput('ok');",
"}",
"function leer(name) {",
"  var sh = SpreadsheetApp.getActiveSpreadsheet().getSheetByName(name);",
"  if (!sh || sh.getLastRow() < 2) return [];",
"  return sh.getRange(2, 1, sh.getLastRow()-1, sh.getLastColumn()).getValues();",
"}",
"function doGet(e) {",
"  var p = e.parameter || {}, out = {ok: false};",
"  if (p.k === ADMIN || (p.k === KEY && p.g)) {",
"    var g = leer('QR generados'), s = leer('Ingresos');",
"    if (p.k !== ADMIN) { g = g.filter(function(r){ return r[1] === p.g; }); s = s.filter(function(r){ return r[1] === p.g; }); }",
"    out = {ok: true, gen: g.map(function(r){ return [+new Date(r[0]), r[1], r[2], r[3], r[4], r[5], r[6]]; }),",
"           scans: s.map(function(r){ return [+new Date(r[0]), r[1], r[2], r[3], r[4], r[5], r[6], r[7], r[8], r[9]]; })};",
"  }",
"  return ContentService.createTextOutput(JSON.stringify(out)).setMimeType(ContentService.MimeType.JSON);",
"}",
"function resumen() {",
"  var ss = SpreadsheetApp.getActiveSpreadsheet(), gen = leer('QR generados'), ing = leer('Ingresos');",
"  var G = {}, P = {}, Q = {};",
"  function grupo(n){ return G[n] || (G[n] = {name: n, gen: 0, ing: 0, VIP: 0, GENERAL: 0, 'CUMPLEAÑOS': 0, usados: {}}); }",
"  function prom(g, p){ var k = g + '|' + p; return P[k] || (P[k] = {g: g, p: p, gen: 0, ing: 0}); }",
"  gen.forEach(function(r){ grupo(r[1]).gen++; prom(r[1], r[2]).gen++; });",
"  ing.forEach(function(r){ var g = grupo(r[1]); g.ing++; g[r[3]] = (g[r[3]] || 0) + 1; g.usados[r[6]] = 1; prom(r[1], r[4]).ing++;",
"    var q = Q[r[6]] || (Q[r[6]] = {g: r[1], name: r[2], type: r[3], p: r[4], n: 0}); q.n++; });",
"  var gl = Object.keys(G).map(function(k){ return G[k]; }).sort(function(a,b){ return b.gen - a.gen || b.ing - a.ing; });",
"  var rs = ss.getSheetByName('Resumen') || ss.insertSheet('Resumen', 0); rs.clear();",
"  var E = ['', '', '', '', '', '', ''], out = [], head = [];",
"  out.push(['QR GENERADOS', gen.length, '', 'INGRESOS', ing.length, '', '']);",
"  out.push(['Actualizado', new Date(), '', 'QR distintos usados', Object.keys(Q).length, '', '']); out.push(E);",
"  out.push(['Puesto', 'Grupo', 'QR generados', 'QR usados', 'Ingresos', 'VIP / General / Cumple', '% ingresos']); head.push(out.length);",
"  gl.forEach(function(g, i){ out.push([i+1, g.name, g.gen, Object.keys(g.usados).length, g.ing, (g.VIP||0) + ' / ' + (g.GENERAL||0) + ' / ' + (g['CUMPLEAÑOS']||0), ing.length ? Math.round(g.ing*1000/ing.length)/10 + '%' : '0%']); });",
"  out.push(E); out.push(['POR PROMOTOR', '', '', '', '', '', '']);",
"  out.push(['Grupo', 'Promotor', 'QR generados', 'Ingresos', '', '', '']); head.push(out.length);",
"  gl.forEach(function(g){ Object.keys(P).map(function(k){ return P[k]; }).filter(function(x){ return x.g === g.name; })",
"    .sort(function(a,b){ return b.gen - a.gen || b.ing - a.ing; }).forEach(function(x){ out.push([x.g, x.p, x.gen, x.ing, '', '', '']); }); });",
"  var PER = {};",
"  function per(n){ var k = String(n).toLowerCase().replace(/\\s+/g, ' ').trim(); return PER[k] || (PER[k] = {n: n, qr: {}, gen: 0, ing: 0, g: {}}); }",
"  gen.forEach(function(r){ var x = per(r[4]); x.gen++; x.qr[r[6]] = 1; x.g[r[1]] = 1; });",
"  ing.forEach(function(r){ var x = per(r[2]); x.ing++; x.qr[r[6]] = 1; x.g[r[1]] = 1; });",
"  out.push(E); out.push(['POR PERSONA (todos sus QR sumados)', '', '', '', '', '', '']);",
"  out.push(['Persona', 'Cantidad de QR', 'QR generados', 'Ingresos totales', 'Grupos', '', '']); head.push(out.length);",
"  Object.keys(PER).map(function(k){ return PER[k]; }).sort(function(a,b){ return b.ing - a.ing || Object.keys(b.qr).length - Object.keys(a.qr).length; })",
"    .forEach(function(x){ out.push([x.n, Object.keys(x.qr).length, x.gen, x.ing, Object.keys(x.g).join(', '), '', '']); });",
"  out.push(E); out.push(['INGRESOS POR QR (cada grupo en orden)', '', '', '', '', '', '']);",
"  gl.forEach(function(g, i){",
"    out.push([(i+1) + '. ' + g.name, '', 'QR generados: ' + g.gen, 'Ingresos: ' + g.ing, '', '', '']);",
"    out.push(['Nombre del QR', 'Tipo', 'Promotor', 'Ingresos', '', '', '']); head.push(out.length);",
"    Object.keys(Q).map(function(k){ return Q[k]; }).filter(function(q){ return q.g === g.name; })",
"      .sort(function(a,b){ return b.n - a.n; }).forEach(function(q){ out.push([q.name, q.type, q.p, q.n, '', '', '']); });",
"    out.push(E);",
"  });",
"  rs.getRange(1, 1, out.length, 7).setValues(out);",
"  rs.getRange(1, 1, 2, 7).setFontWeight('bold'); rs.getRange(1, 2).setFontSize(14); rs.getRange(1, 5).setFontSize(14);",
"  head.forEach(function(r){ rs.getRange(r, 1, 1, 7).setFontWeight('bold').setBackground('#1f1f28').setFontColor('#ffffff'); });",
"  rs.autoResizeColumns(1, 7);",
"}"].join('\n');
}

/* ============ conteo en vivo (lee Google Sheets) ============ */
let liveTimer=0;
const LABEL2KEY={VIP:'vip',GENERAL:'general','CUMPLEAÑOS':'cumple'};
async function fetchLive(url,params){
  const r=await fetch(url+(url.includes('?')?'&':'?')+new URLSearchParams(params).toString(),{cache:'no-store'});
  const j=await r.json(); if(!j.ok) throw new Error('clave');
  const gen=j.gen.map(r=>({t:r[0],group:String(r[1]),promoter:String(r[2]),type:LABEL2KEY[r[3]]||'general',guest:String(r[4]),pax:+r[5]||0,id:String(r[6])}));
  const vipPax={}; gen.forEach(x=>{ if(x.type==='vip') vipPax[x.id]=x.pax; });
  const scans={};
  j.scans.forEach(r=>{ const id=String(r[6]); const e=scans[id]||(scans[id]={type:LABEL2KEY[r[3]]||'general',guest:String(r[2]),group:String(r[1]),promoter:String(r[4]),extra:String(r[5]||''),pax:vipPax[id]||0,times:[],used:0});
    if(!e.times.includes(r[0])) e.times.push(r[0]); });
  Object.values(scans).forEach(e=>{ e.times.sort((a,b)=>a-b); e.used=e.times.length; });
  return {gen,scans,at:Date.now()};
}
function liveGroups(data){
  const G={};
  const grp=n=>G[n]||(G[n]={name:n,gen:0,ing:0,used:new Set(),prom:{}});
  const pr=(g,p)=>g.prom[p]||(g.prom[p]={gen:0,ing:0});
  data.gen.forEach(x=>{ const g=grp(x.group); g.gen++; pr(g,x.promoter).gen++; });
  Object.entries(data.scans).forEach(([id,x])=>{ const g=grp(x.group); g.ing+=x.used; g.used.add(id); pr(g,x.promoter).ing+=x.used; });
  return Object.values(G).sort((a,b)=>b.gen-a.gen||b.ing-a.ing);
}
function liveHtml(data,{single}={}){
  const gl=liveGroups(data), genT=data.gen.length, ingT=gl.reduce((a,g)=>a+g.ing,0);
  const promTable=g=>`<table style="margin-top:6px"><tr><th>Promotor</th><th class="n">QR generados</th><th class="n">Ingresos</th></tr>${Object.entries(g.prom).sort((a,b)=>b[1].gen-a[1].gen||b[1].ing-a[1].ing).map(([p,x])=>`<tr><td>${esc(p)}</td><td class="n"><b>${x.gen}</b></td><td class="n">${x.ing}</td></tr>`).join('')}</table>`;
  const head=`<div class="stats" style="grid-template-columns:1fr 1fr"><div class="stat"><b>${genT}</b><span>QR generados</span></div><div class="stat"><b>${ingT}</b><span>Ingresos</span></div></div>
    <p class="muted" style="text-align:center;margin:8px 0 0">Actualizado ${new Date(data.at).toLocaleTimeString('es',{hour:'2-digit',minute:'2-digit',second:'2-digit'})} · se actualiza solo</p>`;
  if(single) return head+(gl[0]?promTable(gl[0]):'<p class="muted">Tu grupo aún no genera QR.</p>');
  const per=byPerson(data.scans,data.gen).filter(p=>p.qrs>1);
  const perHtml=`<details style="margin-top:8px"><summary class="muted" style="cursor:pointer">Personas con varios QR (${per.length})</summary>${per.length?`<table style="margin-top:6px"><tr><th>Persona</th><th class="n">QR</th><th class="n">Ingresos</th></tr>${per.slice(0,100).map(p=>`<tr><td>${esc(p.name)}<div class="muted" style="font-size:11px">${esc([...p.groups].join(', '))}</div></td><td class="n">${p.qrs}</td><td class="n"><b>${p.ing}</b></td></tr>`).join('')}</table>`:'<p class="muted">Nadie tiene más de un QR todavía.</p>'}</details>`;
  return head+`<table style="margin-top:12px"><tr><th>#</th><th>Grupo</th><th class="n">QR generados</th><th class="n">QR usados</th><th class="n">Ingresos</th></tr>
    ${gl.map((g,i)=>`<tr><td>${i+1}</td><td><b>${esc(g.name)}</b></td><td class="n"><b>${g.gen}</b></td><td class="n">${g.used.size}</td><td class="n">${g.ing}</td></tr>`).join('')||'<tr><td colspan="5" class="muted">Aún no hay QR generados.</td></tr>'}
    ${gl.length?`<tr><td></td><td><b>TOTAL</b></td><td class="n"><b>${genT}</b></td><td class="n">${gl.reduce((a,g)=>a+g.used.size,0)}</td><td class="n"><b>${ingT}</b></td></tr>`:''}</table>
    ${gl.map(g=>`<details style="margin-top:8px"><summary class="muted" style="cursor:pointer">Promotores de ${esc(g.name)}</summary>${promTable(g)}</details>`).join('')}${perHtml}`;
}

/* ============ reporte de la noche (solo admin) ============ */
function adminReport(){
  const box=$('#rep_box'); if(!box) return;
  const rk='pq_night_'+draft.eventId; const scans=store.get(rk,{}), devs=store.get(rk+'_dev',{});
  const d=nightData(scans);
  const live=draft.sheetUrl&&draft.adminKey;
  box.innerHTML=`${live?`<h2 style="margin-top:0">En vivo · QR por grupo</h2><div id="lv_box"><span class="muted">Cargando…</span></div>
    <div class="row"><button class="btn sec" id="lv_ref">Actualizar</button><button class="btn" id="lv_xlsx" disabled>⬇ Excel en vivo</button></div>
    <div style="border-top:1px solid var(--line);margin:18px 0 0"></div>`:''}
    <h2 style="${live?'':'margin-top:0'}">${live?'Respaldo: conteos de la puerta':'Reporte de la noche'}</h2>
    <p class="muted" style="margin-top:0">Carga aquí los conteos que te mandan los celulares de puerta (puedes cargar varios a la vez; no se duplica nada).</p>
    <button class="btn sec" id="rp_load">Cargar conteos de la puerta</button><input type="file" id="rp_file" accept=".json,application/json" multiple class="hide">
    ${Object.keys(devs).length?`<p class="muted">Celulares cargados: ${Object.entries(devs).map(([k,v])=>`${esc(k)} (${v})`).join(' · ')}</p>`:''}
    <div class="stats" style="margin-top:12px"><div class="stat"><b>${d.total}</b><span>Ingresos</span></div><div class="stat"><b style="color:var(--vip)">${d.byT.vip}</b><span>VIP</span></div><div class="stat"><b style="color:var(--gen)">${d.byT.general}</b><span>General</span></div><div class="stat"><b style="color:var(--cum)">${d.byT.cumple}</b><span>Cumple</span></div></div>
    <p class="muted" style="text-align:center">${d.qrs.length} QR distintos entraron</p>
    ${d.gl.map((g,i)=>`<div style="padding:10px 0;border-bottom:1px solid var(--line)"><div style="display:flex;justify-content:space-between"><b>${i+1}. ${esc(g.name)}</b><b>${g.total}</b></div>
      <details><summary class="muted" style="cursor:pointer">VIP ${g.vip} · General ${g.general} · Cumple ${g.cumple} · ${g.qrs.length} QR</summary>
      <table style="margin-top:6px"><tr><th>Nombre del QR</th><th>Promotor</th><th class="n">Ingresos</th></tr>${g.qrs.map(q=>`<tr><td><span class="pill p-${q.type}">${TYPES[q.type].label[0]}</span> ${esc(q.guest)}</td><td class="muted">${esc(q.promoter)}</td><td class="n"><b>${q.used}</b></td></tr>`).join('')}</table></details></div>`).join('')}
    <button class="btn" id="rp_xlsx" ${d.total?'':'disabled'}>⬇ Excel de la noche (.xlsx)</button>
    ${d.total?'<button class="btn ghost" id="rp_clear" style="font-size:13px">Vaciar reporte</button>':''}`;
  if(live){ let last=null; const load=async()=>{ const b=$('#lv_box'); if(!b) return clearInterval(liveTimer);
      try{ last=await fetchLive(draft.sheetUrl,{k:draft.adminKey}); b.innerHTML=liveHtml(last); $('#lv_xlsx').disabled=false; }
      catch(e){ b.innerHTML='<p class="muted">No se pudo leer tu hoja de Google. Revisa la URL, tu internet, y que hayas pegado el código más reciente (botón “Copiar código para Google”).</p>'; } };
    $('#lv_ref').onclick=load; $('#lv_xlsx').onclick=()=>{ if(last) shareOrDownload(nightXlsx(draft,last.scans,last.gen),`ingresos-${evSlug(draft)}.xlsx`,'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'); };
    clearInterval(liveTimer); load(); liveTimer=setInterval(load,30000); }
  $('#rp_load').onclick=()=>$('#rp_file').click();
  $('#rp_file').onchange=async e=>{ let n=0,bad=0; const s=store.get(rk,{}), dv=store.get(rk+'_dev',{});
    for(const f of e.target.files){ try{ const j=JSON.parse(await f.text()); if(j.ev!==draft.eventId){ bad++; continue; } const c=Object.values(j.scans||{}).reduce((a,x)=>a+(x.times||[]).length,0); n+=mergeInto(s,j.scans); dv[j.dev||f.name]=c; }catch(err){ bad++; } }
    store.set(rk,s); store.set(rk+'_dev',dv); e.target.value=''; toast(`${n} ingresos nuevos sumados${bad?` · ${bad} archivo(s) de otro evento o dañados`:''}`); adminReport(); };
  if($('#rp_xlsx')) $('#rp_xlsx').onclick=()=>shareOrDownload(nightXlsx(draft,store.get(rk,{})),`ingresos-${evSlug(draft)}.xlsx`,'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet');
  if($('#rp_clear')) $('#rp_clear').onclick=async()=>{ if(await confirmBox('¿Vaciar el reporte cargado? Puedes volver a cargar los archivos luego.')){ store.set(rk,{}); store.set(rk+'_dev',{}); adminReport(); } };
}
