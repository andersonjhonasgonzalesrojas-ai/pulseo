:root{--bg:#0b0b0f;--card:#16161d;--line:#26262f;--txt:#f2f2f5;--mut:#8b8b98;--red:#ff3b3b;--vip:#d4af37;--gen:#ff3b3b;--cum:#ff4fa3;--ok:#19c37d;--warn:#f5a524}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
body{min-height:100vh;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.wrap{max-width:560px;margin:0 auto;padding:18px 16px 60px}
.wide{max-width:1100px}
h1{font-size:22px;margin:4px 0 2px;letter-spacing:.5px}
h2{font-size:16px;margin:22px 0 10px;color:var(--mut);text-transform:uppercase;letter-spacing:1.5px;font-weight:600}
.sub{color:var(--mut);font-size:14px;margin:0 0 14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px}
label{display:block;font-size:13px;color:var(--mut);margin:12px 0 6px}
input,select{width:100%;padding:14px;border-radius:12px;border:1px solid var(--line);background:#0f0f14;color:var(--txt);font-size:16px;outline:none}
input:focus{border-color:var(--red)}
input[type=range]{padding:0;accent-color:var(--red)}
input[type=file]{padding:10px;font-size:14px}
.row{display:flex;gap:10px}.row>*{flex:1}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:16px;border-radius:14px;border:0;font-size:16px;font-weight:700;cursor:pointer;background:var(--red);color:#fff;text-decoration:none;margin-top:12px}
.btn.sec{background:#23232c;color:var(--txt)}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--txt)}
.btn:disabled{opacity:.4}
.tabs{display:flex;gap:8px;margin:6px 0 4px}
.tab{flex:1;padding:14px 6px;border-radius:14px;border:2px solid var(--line);background:#0f0f14;color:var(--txt);font-weight:800;font-size:14px;cursor:pointer;letter-spacing:.5px}
.tab.on.vip{border-color:var(--vip);background:#2a2410;color:var(--vip)}
.tab.on.general{border-color:var(--gen);background:#2a1212;color:var(--gen)}
.tab.on.cumple{border-color:var(--cum);background:#2a1220;color:var(--cum)}
.hide{display:none!important}
.out img{width:100%;border-radius:14px;display:block}
.muted{color:var(--mut);font-size:13px}
.pill{display:inline-block;padding:3px 9px;border-radius:99px;font-size:12px;font-weight:700}
.p-vip{background:#2a2410;color:var(--vip)}.p-general{background:#2a1212;color:var(--gen)}.p-cumple{background:#2a1220;color:var(--cum)}
table{width:100%;border-collapse:collapse;font-size:14px}
td,th{padding:9px 6px;border-bottom:1px solid var(--line);text-align:left}
th{color:var(--mut);font-weight:600;font-size:12px;text-transform:uppercase}
td.n,th.n{text-align:right}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.stat{background:#0f0f14;border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
.stat b{display:block;font-size:24px}.stat span{font-size:11px;color:var(--mut);text-transform:uppercase}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:20px}
@media(max-width:820px){.grid2{grid-template-columns:1fr}}
.prev canvas{width:100%;border-radius:12px;border:1px solid var(--line)}
.typebox{border-left:4px solid var(--line);padding-left:12px;margin:14px 0}
.typebox.vip{border-color:var(--vip)}.typebox.general{border-color:var(--gen)}.typebox.cumple{border-color:var(--cum)}
.chk{display:flex;align-items:center;gap:10px;margin-top:10px;font-size:14px;color:var(--txt)}
.chk input{width:auto}
/* scanner */
#scanView{position:fixed;inset:0;background:#000;display:flex;flex-direction:column}
#scanTop{display:flex;align-items:center;justify-content:space-between;padding:calc(env(safe-area-inset-top) + 10px) 14px 10px;background:#0b0b0f;gap:10px}
#scanTop .count{font-size:13px;color:var(--mut)}#scanTop .count b{font-size:22px;color:#fff;display:block}
#camBox{position:relative;flex:1;overflow:hidden}
#video{width:100%;height:100%;object-fit:cover}
#frame{position:absolute;left:50%;top:50%;width:68vmin;height:68vmin;transform:translate(-50%,-50%);border-radius:22px;box-shadow:0 0 0 2000px rgba(0,0,0,.45);border:3px solid rgba(255,255,255,.85)}
#camMsg{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;gap:6px}
#result{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px;z-index:10}
#result .big{font-size:44px;font-weight:900;letter-spacing:1px}
#result .info{font-size:22px;margin-top:14px;font-weight:700}
#result .det{font-size:16px;margin-top:8px;opacity:.9}
#result.ok{background:#0e8a55}#result.warn{background:#b8770c}#result.bad{background:#b3261e}
#scanBottom{display:flex;gap:8px;padding:10px 14px calc(env(safe-area-inset-bottom) + 10px);background:#0b0b0f}
#scanBottom .btn{margin:0;padding:14px;font-size:14px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.75);display:flex;align-items:center;justify-content:center;z-index:50;padding:20px}
.modal .card{max-width:420px;width:100%}
.list .it{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px;gap:8px}
.toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);background:#23232c;padding:12px 18px;border-radius:12px;z-index:60;font-size:14px}
code.k{background:#0f0f14;border:1px solid var(--line);padding:2px 6px;border-radius:6px;font-size:12px;word-break:break-all}
ol.steps{padding-left:20px;line-height:1.6;font-size:14px}
</style>

<body>
<div id="app"></div>
<script>
"use strict";
/* ============ base ============ */
const SOURCE = '<!DOCTYPE html>\n' + document.documentElement.outerHTML;
let CFG = null;
try { CFG = JSON.parse(document.getElementById('cfg').textContent); } catch(e) { CFG = null; }
let ADMIN_TEST = false, TEST_G = null;
const TYPES = {
  vip:{label:'VIP',code:'V',color:'#d4af37'},
  general:{label:'GENERAL',code:'G',color:'#ff3b3b'},
  cumple:{label:'CUMPLEAÑOS',code:'C',color:'#ff4fa3'}
};
const CODE2TYPE = {V:'vip',G:'general',C:'cumple'};
const $ = (s,r=document)=>r.querySelector(s);
const app = $('#app');
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const store = {
  get(k,d){ try{ const v=localStorage.getItem(k); return v==null?d:JSON.parse(v);}catch(e){return d;} },
  set(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }
};
function toast(msg){ const t=document.createElement('div'); t.className='toast'; t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(),2200); }
function clean(s,max){ return String(s||'').replace(/[|\n\r]/g,' ').replace(/\s+/g,' ').trim().slice(0,max); }
function rnd(n){ const a=new Uint8Array(n); crypto.getRandomValues(a); return a; }
const ALPH='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
function rid(n){ return Array.from(rnd(n),b=>ALPH[b%ALPH.length]).join(''); }
function confirmBox(msg){ return new Promise(res=>{ const m=document.createElement('div'); m.className='modal'; m.innerHTML=`<div class="card"><p style="margin-top:0">${esc(msg)}</p><div class="row"><button class="btn sec" data-a="0">Cancelar</button><button class="btn" data-a="1">Sí, continuar</button></div></div>`; m.onclick=e=>{const a=e.target.dataset.a; if(a!=null){m.remove();res(a==='1');}}; document.body.appendChild(m); }); }
function promptBox(title,placeholder,type='text'){ return new Promise(res=>{ const m=document.createElement('div'); m.className='modal'; m.innerHTML=`<div class="card"><h1 style="font-size:18px">${esc(title)}</h1><input type="${type}" placeholder="${esc(placeholder)}" autocomplete="off"><button class="btn">Entrar</button></div>`; const i=$('input',m); const go=()=>{m.remove();res(i.value);}; $('button',m).onclick=go; i.onkeydown=e=>{if(e.key==='Enter')go();}; document.body.appendChild(m); setTimeout(()=>i.focus(),50); }); }

/* ============ SHA-256 / HMAC (puro JS, funciona sin https) ============ */
const K256=[0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2];
function sha256(bytes){
  const l=bytes.length, bl=((l+9+63)>>6)<<6, m=new Uint8Array(bl); m.set(bytes); m[l]=0x80;
  const bits=l*8; m[bl-4]=(bits>>>24)&255; m[bl-3]=(bits>>>16)&255; m[bl-2]=(bits>>>8)&255; m[bl-1]=bits&255;
  m[bl-8]=Math.floor(l/0x20000000)&255;
  let h=[0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19];
  const w=new Uint32Array(64), r=(x,n)=>(x>>>n)|(x<<(32-n));
  for(let i=0;i<bl;i+=64){
    for(let t=0;t<16;t++) w[t]=(m[i+t*4]<<24)|(m[i+t*4+1]<<16)|(m[i+t*4+2]<<8)|m[i+t*4+3];
    for(let t=16;t<64;t++){ const s0=r(w[t-15],7)^r(w[t-15],18)^(w[t-15]>>>3), s1=r(w[t-2],17)^r(w[t-2],19)^(w[t-2]>>>10); w[t]=(w[t-16]+s0+w[t-7]+s1)|0; }
    let [a,b,c,d,e,f,g,hh]=h;
    for(let t=0;t<64;t++){ const S1=r(e,6)^r(e,11)^r(e,25), ch=(e&f)^(~e&g), t1=(hh+S1+ch+K256[t]+w[t])|0, S0=r(a,2)^r(a,13)^r(a,22), mj=(a&b)^(a&c)^(b&c), t2=(S0+mj)|0; hh=g;g=f;f=e;e=(d+t1)|0;d=c;c=b;b=a;a=(t1+t2)|0; }
    h=[(h[0]+a)|0,(h[1]+b)|0,(h[2]+c)|0,(h[3]+d)|0,(h[4]+e)|0,(h[5]+f)|0,(h[6]+g)|0,(h[7]+hh)|0];
  }
  const o=new Uint8Array(32); h.forEach((v,i)=>{o[i*4]=(v>>>24)&255;o[i*4+1]=(v>>>16)&255;o[i*4+2]=(v>>>8)&255;o[i*4+3]=v&255;}); return o;
}
const enc = s => new TextEncoder().encode(s);
function hmac(keyStr,msg){
  let k=enc(keyStr); if(k.length>64) k=sha256(k);
  const kp=new Uint8Array(64); kp.set(k);
  const ip=kp.map(b=>b^0x36), op=kp.map(b=>b^0x5c), mb=enc(msg);
  const inner=new Uint8Array(64+mb.length); inner.set(ip); inner.set(mb,64);
  const ih=sha256(inner); const outer=new Uint8Array(96); outer.set(op); outer.set(ih,64);
  return sha256(outer);
}
function b64u(bytes){ let s=''; bytes.forEach(b=>s+=String.fromCharCode(b)); return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,''); }
const hashPin = p => b64u(sha256(enc('pin:'+String(p).trim())));

/* ============ payload del QR ============ */
// PQ2|evento|tipo|id|pax(0=ilimitado)|grupo|promotor|nombre|extra|firma
const personKey=n=>String(n||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/\s+/g,' ').trim();
const ascii=(s,n)=>clean(String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^\x20-\x7e]/g,''),n);
function makePayload(cfg,{type,group,promoter,guest,extra,pax}){
  const parts=['PQ2',cfg.eventId,TYPES[type].code,rid(8),String(Math.max(0,Math.min(99,pax|0))),ascii(group,20),ascii(promoter,22),ascii(guest,28),ascii(extra,10)];
  const body=parts.join('|');
  return {text: body+'|'+b64u(hmac(cfg.secret,body)).slice(0,12), id:parts[3]};
}
function readPayload(cfg,text){
  const p=String(text||'').split('|');
  if(p.length!==10||p[0]!=='PQ2') return {ok:false,why:'Este QR no es una entrada'};
  if(p[1]!==cfg.eventId) return {ok:false,why:'QR de otro evento'};
  const body=p.slice(0,9).join('|');
  if(b64u(hmac(cfg.secret,body)).slice(0,12)!==p[9]) return {ok:false,why:'QR falso o alterado'};
  const type=CODE2TYPE[p[2]]; if(!type) return {ok:false,why:'Tipo de entrada desconocido'};
  return {ok:true,type,id:p[3],pax:parseInt(p[4],10)||0,group:p[5],promoter:p[6],guest:p[7],extra:p[8]};
}
// link firmado de cada grupo: ?g=<n>.<firma>
const groupSig=(cfg,i)=>b64u(hmac(cfg.secret,'g:'+i+':'+cfg.groups[i].name)).slice(0,8);
const leaderHex=(cfg,i)=>Array.from(hmac(cfg.secret,'lh:'+i+':'+cfg.groups[i].name).slice(0,5),b=>b.toString(16).padStart(2,'0')).join('');
const groupHex=(cfg,i)=>Array.from(hmac(cfg.secret,'gh:'+i+':'+cfg.groups[i].name).slice(0,5),b=>b.toString(16).padStart(2,'0')).join('');
function groupFromLink(cfg){
  let g=''; try{ g=new URLSearchParams(location.search).get('g')||''; }catch(e){}
  const hm=location.hash.match(/^#g-(\d+)-([0-9a-f]{10})$/);
  if(hm&&TEST_G==null){ const n=+hm[1]; if(cfg.groups&&cfg.groups[n]&&groupHex(cfg,n)===hm[2]) return {i:n,name:cfg.groups[n].name}; return null; }
  if(TEST_G!=null) g=TEST_G+'.'+groupSig(cfg,TEST_G);
  const [i,s]=g.split('.'); const n=parseInt(i,10);
  if(!cfg.groups||!cfg.groups[n]||groupSig(cfg,n)!==s) return null;
  return {i:n,name:cfg.groups[n].name};
}
const pageBase=()=>(/^https?:$/.test(location.protocol)&&!window.claude)?location.origin+location.pathname:'';
const groupLink=(cfg,i)=>pageBase()?pageBase()+'#g-'+i+'-'+groupHex(cfg,i):cfg.publicUrl?cfg.publicUrl.replace(/#.*$/,'')+'#g-'+i+'-'+groupHex(cfg,i):location.origin.replace(/^null$/,'file://')+location.pathname+'?g='+i+'.'+groupSig(cfg,i);

/* ============ dibujo de la entrada ============ */
const imgCache={};
function loadImg(src){ if(!src) return Promise.resolve(null); if(imgCache[src]) return imgCache[src]; return imgCache[src]=new Promise(r=>{const i=new Image(); i.onload=()=>r(i); i.onerror=()=>r(null); i.src=src;}); }
function rr(ctx,x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
function wrapText(ctx,text,x,y,maxW,lh,maxLines){ const words=String(text).split(' '); let line='',lines=[]; for(const w of words){ const t=line?line+' '+w:w; if(ctx.measureText(t).width>maxW&&line){lines.push(line);line=w;}else line=t;} if(line)lines.push(line); lines=lines.slice(0,maxLines); lines.forEach((l,i)=>ctx.fillText(l,x,y+i*lh)); return lines.length; }
function drawQR(ctx,text,x,y,size){
  if(typeof qrcode!=='function'){ ctx.fillStyle='#000'; ctx.font='bold 30px sans-serif'; ctx.textAlign='center'; ctx.fillText('Sin conexión',x+size/2,y+size/2); return; }
  const q=qrcode(0,'M'); q.addData(text,'Byte'); q.make();
  const n=q.getModuleCount(), quiet=3, cell=size/(n+quiet*2);
  ctx.fillStyle='#fff'; ctx.fillRect(x,y,size,size); ctx.fillStyle='#000';
  for(let r=0;r<n;r++) for(let c=0;c<n;c++) if(q.isDark(r,c)) ctx.fillRect(Math.floor(x+(c+quiet)*cell),Math.floor(y+(r+quiet)*cell),Math.ceil(cell),Math.ceil(cell));
}
async function renderTicket(cfg,type,qrText,info){
  const W=1080,H=1920, t=cfg.types[type], col=TYPES[type].color;
  const cv=document.createElement('canvas'); cv.width=W; cv.height=H; const ctx=cv.getContext('2d');
  const tpl=await loadImg(t.template);
  const F='-apple-system,"Helvetica Neue",Arial,sans-serif';
  if(tpl){
    const s=Math.max(W/tpl.width,H/tpl.height); ctx.drawImage(tpl,(W-tpl.width*s)/2,(H-tpl.height*s)/2,tpl.width*s,tpl.height*s);
    const size=W*t.qrSize/100, cx=W*t.qrX/100, cy=H*t.qrY/100, pad=size*0.06;
    const nameH=t.showName? size*0.2:0;
    ctx.fillStyle='#fff'; rr(ctx,cx-size/2-pad,cy-size/2-pad,size+pad*2,size+pad*2+nameH,size*0.06); ctx.fill();
    drawQR(ctx,qrText,cx-size/2,cy-size/2,size);
    if(t.showName){ ctx.fillStyle='#111'; ctx.textAlign='center'; const nm=info.guest.toUpperCase().slice(0,28); let fs=Math.round(size*0.075); ctx.font=`800 ${fs}px ${F}`; while(fs>10&&ctx.measureText(nm).width>size+pad*1.4){ fs--; ctx.font=`800 ${fs}px ${F}`; } ctx.fillText(nm,cx,cy+size/2+size*0.09);
      ctx.fillStyle=col==='#d4af37'?'#9a7b12':col; ctx.font=`700 ${Math.round(size*0.05)}px ${F}`; ctx.fillText(`${TYPES[type].label}${type==='vip'&&info.pax>1?' · '+info.pax+' PERSONAS':''}`,cx,cy+size/2+size*0.16); }
    return cv;
  }
  // plantilla por defecto
  ctx.fillStyle='#0b0b0f'; ctx.fillRect(0,0,W,H);
  let g=ctx.createRadialGradient(W/2,260,40,W/2,260,1100); g.addColorStop(0,col+'88'); g.addColorStop(1,'#0b0b0f00'); ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  g=ctx.createLinearGradient(0,H-500,0,H); g.addColorStop(0,'#0b0b0f00'); g.addColorStop(1,col+'44'); ctx.fillStyle=g; ctx.fillRect(0,H-500,W,500);
  ctx.textAlign='center'; ctx.fillStyle='#fff';
  ctx.font=`900 104px ${F}`; const nl=wrapText(ctx,(cfg.eventName||'EVENTO').toUpperCase(),W/2,210,W-140,108,2);
  ctx.fillStyle='#c9c9d2'; ctx.font=`600 44px ${F}`; const yInfo=210+nl*108+10;
  if(cfg.date) ctx.fillText(cfg.date,W/2,yInfo);
  if(cfg.venue) ctx.fillText(cfg.venue,W/2,yInfo+58);
  const label=TYPES[type].label; ctx.font=`900 52px ${F}`; const lw=ctx.measureText(label).width+90;
  ctx.fillStyle=col; rr(ctx,W/2-lw/2,560,lw,96,48); ctx.fill(); ctx.fillStyle=type==='vip'?'#1a1404':'#fff'; ctx.fillText(label,W/2,627);
  const cx=150,cy=720,cw=W-300,qs=cw-80;
  ctx.fillStyle='#fff'; rr(ctx,cx,cy,cw,qs+260,40); ctx.fill();
  drawQR(ctx,qrText,cx+40,cy+40,qs);
  ctx.fillStyle='#111'; ctx.font=`800 56px ${F}`; ctx.fillText(info.guest.toUpperCase().slice(0,24),W/2,cy+qs+120);
  ctx.fillStyle='#666'; ctx.font=`600 34px ${F}`;
  let sub = type==='cumple' ? `Cumpleaños${info.extra?' · '+info.extra:''}` : `${info.group||''}`;
  ctx.fillText(sub.slice(0,40),W/2,cy+qs+180);
  ctx.fillStyle='#fff'; ctx.font=`700 40px ${F}`;
  ctx.fillText(type==='vip'?(info.pax>1?`Válido para ${info.pax} personas`:'Válido para 1 persona'):'Entrada libre · muestra este QR en puerta',W/2,H-200);
  ctx.fillStyle='#8b8b98'; ctx.font=`500 32px ${F}`; ctx.fillText('Presenta este QR en puerta · Código '+info.id,W/2,H-140);
  return cv;
}

/* ============ ROUTER ============ */
// Archivo del admin (sin evento) = creador. App del evento = promotor (con link de grupo), #lider, #escaner. No hay acceso al creador desde la app publicada.
function route(){
  stopCam();
  const h=location.hash.replace('#','');
  if(!CFG || (ADMIN_TEST && h==='admin')) return viewAdmin();
  if(h==='escaner') return viewScanner();
  if(h==='lider'||h.startsWith('lider-')) return viewLeader();

function shrinkImage(file){ return new Promise(res=>{ const r=new FileReader(); r.onload=()=>{ const i=new Image(); i.onload=()=>{ const s=Math.min(1,1080/i.width); const c=document.createElement('canvas'); c.width=Math.round(i.width*s); c.height=Math.round(i.height*s); c.getContext('2d').drawImage(i,0,0,c.width,c.height); res(c.toDataURL('image/jpeg',0.86)); }; i.src=r.result; }; r.readAsDataURL(file); }); }

    const c=new DataView(new ArrayBuffer(46)); c.setUint32(0,0x02014b50,true); c.setUint16(4,20,true); c.setUint16(6,20,true); c.setUint16(8,0x0800,true); c.setUint16(14,0x21,true); c.setUint32(16,crc,true); c.setUint32(20,d.length,true); c.setUint32(24,d.length,true); c.setUint16(28,nm.length,true); c.setUint32(42,off,true);

function byPerson(scans,gen){
  const P={}; const get=n=>{ const k=personKey(n); return P[k]||(P[k]={name:n,ids:new Set(),gen:0,ing:0,types:new Set(),groups:new Set(),proms:new Set()}); };

function nightData(s){
  const qrs=Object.entries(s).map(([id,x])=>({id,...x,used:x.times.length}));
  const groups={};
  qrs.forEach(q=>{ const g=groups[q.group]||(groups[q.group]={name:q.group,vip:0,general:0,cumple:0,total:0,qrs:[],prom:{}});
    g[q.type]+=q.used; g.total+=q.used; g.qrs.push(q);
    const p=g.prom[q.promoter]||(g.prom[q.promoter]={vip:0,general:0,cumple:0,total:0,qrs:0}); p[q.type]+=q.used; p.total+=q.used; p.qrs++; });
  const gl=Object.values(groups).sort((a,b)=>b.total-a.total||a.name.localeCompare(b.name));
  gl.forEach(g=>g.qrs.sort((a,b)=>b.used-a.used||a.guest.localeCompare(b.guest)));
  const all=qrs.flatMap(q=>q.times.map(t=>({t,...q}))).sort((a,b)=>a.t-b.t);

// En páginas de Claude: capacidad "downloads" (en el iPhone abre el menú para compartir/guardar)
let _dl;
function claudeDownloads(){ if(_dl!==undefined) return _dl; if(!window.claude||typeof window.claude.use!=='function') return (_dl=Promise.resolve(null));
  return (_dl=Promise.race([window.claude.use('downloads').catch(()=>null),new Promise(r=>setTimeout(()=>r(null),4000))])); }
async function shareOrDownload(blob,name,mime){
  const dl=await claudeDownloads();
  if(dl){ try{ await dl.save({filename:name,data:blob}); return; }catch(e){ if(e&&e.code==='declined') return; } }
  const f=new File([blob],name,{type:mime});
  try{ if(navigator.canShare&&navigator.canShare({files:[f]})){ await navigator.share({files:[f],title:name}); return; } }catch(e){ if(e.name==='AbortError') return; }
  try{ const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click(); a.remove(); }catch(e){}
  toast('Mantén presionada la imagen para guardarla');
}
function mergeInto(s,incoming){
  let added=0;
  Object.entries(incoming||{}).forEach(([id,x])=>{ const e=s[id]||{...x,times:[]}; const set=new Set(e.times); (x.times||[]).forEach(t=>{ if(!set.has(t)){ set.add(t); added++; } });
    e.times=[...set].sort((a,b)=>a-b); e.used=e.times.length; s[id]=e; });
  return added;
}

async function syncNow(){
  const st=$('#syncSt'); if(!CFG.sheetUrl){ return; }
  if(syncing) return; const q=store.get(qKey(),[]);
  if(!q.length){ if(st) st.textContent=st.dataset.ok||'● En vivo · todo enviado'; return; }
  if(!navigator.onLine){ if(st) st.textContent=`○ Sin internet · ${q.length} por enviar`; return; }
  syncing=true; const batch=q.slice(0,60);
  try{ await fetch(CFG.sheetUrl,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({key:CFG.sheetKey,rows:batch})});
    const sent=new Set(batch.map(b=>b.uid)); store.set(qKey(),store.get(qKey(),[]).filter(x=>!sent.has(x.uid)));
  }catch(e){}
  syncing=false; const left=store.get(qKey(),[]).length;

function liveGroups(data){
  const G={};
  const grp=n=>G[n]||(G[n]={name:n,gen:0,ing:0,used:new Set(),prom:{}});
  const pr=(g,p)=>g.prom[p]||(g.prom[p]={gen:0,ing:0});
  data.gen.forEach(x=>{ const g=grp(x.group); g.gen++; pr(g,x.promoter).gen++; });
  Object.entries(data.scans).forEach(([id,x])=>{ const g=grp(x.group); g.ing+=x.used; g.used.add(id); pr(g,x.promoter).ing+=x.used; });
  return Object.values(G).sort((a,b)=>b.gen-a.gen||b.ing-a.ing);

  const perHtml=`<details style="margin-top:8px"><summary class="muted" style="cursor:pointer">Personas con varios QR (${per.length})</summary>${per.length?`<table style="margin-top:6px"><tr><th>Persona</th><th class="n">QR</th><th class="n">Ingresos</th></tr>${per.slice(0,100).map(p=>`<tr><td>${esc(p.name)}<div class="muted" style="font-size:11px">${esc([...p.groups].join(', '))}</div></td><td class="n">${p.qrs}</td><td class="n"><b>${p.ing}</b></td></tr>`).join('')}</table>`:'<p class="muted">Nadie tiene más de un QR todavía.</p>'}</details>`;
  return head+`<table style="margin-top:12px"><tr><th>#</th><th>Grupo</th><th class="n">QR generados</th><th class="n">QR usados</th><th class="n">Ingresos</th></tr>
    ${gl.map((g,i)=>`<tr><td>${i+1}</td><td><b>${esc(g.name)}</b></td><td class="n"><b>${g.gen}</b></td><td class="n">${g.used.size}</td><td class="n">${g.ing}</td></tr>`).join('')||'<tr><td colspan="5" class="muted">Aún no hay QR generados.</td></tr>'}
    ${gl.length?`<tr><td></td><td><b>TOTAL</b></td><td class="n"><b>${genT}</b></td><td class="n">${gl.reduce((a,g)=>a+g.used.size,0)}</td><td class="n"><b>${ingT}</b></td></tr>`:''}</table>
    ${gl.map(g=>`<details style="margin-top:8px"><summary class="muted" style="cursor:pointer">Promotores de ${esc(g.name)}</summary>${promTable(g)}</details>`).join('')}${perHtml}`;
}

/* ============ reporte de la noche (solo admin) ============ */
function adminReport(){
  const box=$('#rep_box'); if(!box) return;
  const rk='pq_night_'+draft.eventId; const scans=store.get(rk,{}), devs=store.get(rk+'_dev',{});
  const d=nightData(scans);
  const live=draft.sheetUrl&&draft.adminKey;
  box.innerHTML=`${live?`<h2 style="margin-top:0">En vivo · QR por grupo</h2><div id="lv_box"><span class="muted">Cargando…</span></div>
    <div class="row"><button class="btn sec" id="lv_ref">Actualizar</button><button class="btn" id="lv_xlsx" disabled>⬇ Excel en vivo</button></div>
    <div style="border-top:1px solid var(--line);margin:18px 0 0"></div>`:''}
    <h2 style="${live?'':'margin-top:0'}">${live?'Respaldo: conteos de la puerta':'Reporte de la noche'}</h2>
    <p class="muted" style="margin-top:0">Carga aquí los conteos que te mandan los celulares de puerta (puedes cargar varios a la vez; no se duplica nada).</p>
    <button class="btn sec" id="rp_load">Cargar conteos de la puerta</button><input type="file" id="rp_file" accept=".json,application/json" multiple class="hide">
    ${Object.keys(devs).length?`<p class="muted">Celulares cargados: ${Object.entries(devs).map(([k,v])=>`${esc(k)} (${v})`).join(' · ')}</p>`:''}
    <div class="stats" style="margin-top:12px"><div class="stat"><b>${d.total}</b><span>Ingresos</span></div><div class="stat"><b style="color:var(--vip)">${d.byT.vip}</b><span>VIP</span></div><div class="stat"><b style="color:var(--gen)">${d.byT.general}</b><span>General</span></div><div class="stat"><b style="color:var(--cum)">${d.byT.cumple}</b><span>Cumple</span></div></div>
    <p class="muted" style="text-align:center">${d.qrs.length} QR distintos entraron</p>
    ${d.gl.map((g,i)=>`<div style="padding:10px 0;border-bottom:1px solid var(--line)"><div style="display:flex;justify-content:space-between"><b>${i+1}. ${esc(g.name)}</b><b>${g.total}</b></div>
      <details><summary class="muted" style="cursor:pointer">VIP ${g.vip} · General ${g.general} · Cumple ${g.cumple} · ${g.qrs.length} QR</summary>
      <table style="margin-top:6px"><tr><th>Nombre del QR</th><th>Promotor</th><th class="n">Ingresos</th></tr>${g.qrs.map(q=>`<tr><td><span class="pill p-${q.type}">${TYPES[q.type].label[0]}</span> ${esc(q.guest)}</td><td class="muted">${esc(q.promoter)}</td><td class="n"><b>${q.used}</b></td></tr>`).join('')}</table></details></div>`).join('')}
    <button class="btn" id="rp_xlsx" ${d.total?'':'disabled'}>⬇ Excel de la noche (.xlsx)</button>
    ${d.total?'<button class="btn ghost" id="rp_clear" style="font-size:13px">Vaciar reporte</button>':''}`;
  if(live){ let last=null; const load=async()=>{ const b=$('#lv_box'); if(!b) return clearInterval(liveTimer);
      try{ last=await fetchLive(draft.sheetUrl,{k:draft.adminKey}); b.innerHTML=liveHtml(last); $('#lv_xlsx').disabled=false; }
      catch(e){ b.innerHTML='<p class="muted">No se pudo leer tu hoja de Google. Revisa la URL, tu internet, y que hayas pegado el código más reciente (botón “Copiar código para Google”).</p>'; } };
    $('#lv_ref').onclick=load; $('#lv_xlsx').onclick=()=>{ if(last) shareOrDownload(nightXlsx(draft,last.scans,last.gen),`ingresos-${evSlug(draft)}.xlsx`,'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'); };
    clearInterval(liveTimer); load(); liveTimer=setInterval(load,30000); }
  $('#rp_load').onclick=()=>$('#rp_file').click();
  $('#rp_file').onchange=async e=>{ let n=0,bad=0; const s=store.get(rk,{}), dv=store.get(rk+'_dev',{});
    for(const f of e.target.files){ try{ const j=JSON.parse(await f.text()); if(j.ev!==draft.eventId){ bad++; continue; } const c=Object.values(j.scans||{}).reduce((a,x)=>a+(x.times||[]).length,0); n+=mergeInto(s,j.scans); dv[j.dev||f.name]=c; }catch(err){ bad++; } }
    store.set(rk,s); store.set(rk+'_dev',dv); e.target.value=''; toast(`${n} ingresos nuevos sumados${bad?` · ${bad} archivo(s) de otro evento o dañados`:''}`); adminReport(); };
  if($('#rp_xlsx')) $('#rp_xlsx').onclick=()=>shareOrDownload(nightXlsx(draft,store.get(rk,{})),`ingresos-${evSlug(draft)}.xlsx`,'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet');
  if($('#rp_clear')) $('#rp_clear').onclick=async()=>{ if(await confirmBox('¿Vaciar el reporte cargado? Puedes volver a cargar los archivos luego.')){ store.set(rk,{}); store.set(rk+'_dev',{}); adminReport(); } };
}

route();
</script>
</body>
</html>
